<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Blade Rush 블레이드 러시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#05060c;
    --panel:rgba(12,15,26,0.78);
    --panel-border:rgba(139,148,171,0.22);
    --steel:#8a94a6;
    --crimson:#ef2b4d;
    --crimson-glow:#ff5c7a;
    --gold:#f0c419;
    --text:#e9ebf3;
    --text-dim:#9aa0b8;
    --danger:#ef2b4d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg-void);
    overflow:hidden;
    font-family:'Noto Sans KR',sans-serif;
    color:var(--text);
    overscroll-behavior:none;
    position:fixed; inset:0;
  }
  #stage{ position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
  canvas{display:block; width:100%; height:100%;}
  .num{font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:0.5px;}

  /* ---------- HUD ---------- */
  #hud{ position:fixed; inset:0; pointer-events:none; padding: max(14px, env(safe-area-inset-top)) 14px 0 14px; }
  #hudTop{ display:flex; justify-content:space-between; align-items:flex-start; }
  .hud-chip{ background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:6px 12px; backdrop-filter: blur(6px); }
  #scoreChip .label{font-size:10px; color:var(--text-dim); letter-spacing:1.5px;}
  #scoreChip .val{font-size:22px; color:var(--gold); line-height:1.1;}
  #distChip{text-align:center;}
  #distChip .label{font-size:10px; color:var(--text-dim); letter-spacing:1.5px;}
  #distChip .val{font-size:18px; color:var(--text); line-height:1.1;}
  #comboChip{text-align:right; opacity:0; transform:translateY(-4px); transition:opacity .15s, transform .15s;}
  #comboChip.show{opacity:1; transform:translateY(0);}
  #comboChip .label{font-size:10px; color:var(--text-dim); letter-spacing:1.5px;}
  #comboChip .val{font-size:22px; color:var(--crimson-glow); line-height:1.1;}
  #hpWrap{ margin-top:10px; height:9px; border-radius:5px; background:rgba(255,255,255,0.08); border:1px solid var(--panel-border); overflow:hidden; }
  #hpBar{ height:100%; width:100%; background:linear-gradient(90deg, var(--danger), var(--crimson-glow)); transition:width .18s ease-out; }

  /* ---------- Overlays ---------- */
  .overlay{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 30%, rgba(20,24,42,0.92), rgba(4,5,10,0.97)); z-index:20; }
  .overlay.hidden{display:none;}
  .panel{ width:min(88vw, 380px); text-align:center; padding:28px 22px; max-height:92vh; overflow-y:auto; }
  .title-mark{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:44px; letter-spacing:2px; color:var(--text); text-shadow:0 0 24px rgba(239,43,77,0.55); margin:0; }
  .title-mark span{color:var(--crimson-glow);}
  .title-sub{ font-size:13px; color:var(--text-dim); margin-top:6px; letter-spacing:3px; }
  .compass{margin:22px auto 4px;}
  .btn{ margin-top:22px; display:inline-block; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; letter-spacing:2px; color:#0a0b12; background:linear-gradient(180deg, var(--gold), #d19f10); border:none; border-radius:10px; padding:14px 40px; box-shadow:0 6px 0 #93700a, 0 10px 24px rgba(240,196,25,0.25); pointer-events:auto; cursor:pointer; }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #93700a;}
  .rules{ text-align:left; margin-top:16px; font-size:12.5px; color:var(--text-dim); line-height:1.85; }
  .rules b{color:var(--text);}
  .stat-row{ display:flex; justify-content:space-between; font-size:13px; color:var(--text-dim); margin:6px 0; border-bottom:1px dashed var(--panel-border); padding-bottom:6px; }
  .stat-row b{color:var(--gold); font-family:'Rajdhani',sans-serif; font-size:17px;}
  .go-title{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:30px; color:var(--crimson-glow); letter-spacing:2px; margin:0 0 18px 0; }

  #finisherBanner{ position:fixed; left:50%; top:36%; transform:translate(-50%,-50%) scale(0.6); font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14vw; color:var(--gold); text-shadow:0 0 30px rgba(240,196,25,0.85), 0 0 60px rgba(239,43,77,0.5); opacity:0; pointer-events:none; z-index:15; letter-spacing:2px; white-space:nowrap; }
  #vignette{ position:fixed; inset:0; pointer-events:none; z-index:10; box-shadow: inset 0 0 0 rgba(239,43,77,0); transition: box-shadow .35s ease-out; }
  #flash{ position:fixed; inset:0; pointer-events:none; z-index:12; background:#fff; opacity:0; }

  #rotateWarn{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:14px;
    background:#05060c; text-align:center; padding:24px;
  }
  #rotateWarn.show{display:flex;}
  #rotateWarn .icon{font-size:52px; animation:rot 1.6s ease-in-out infinite;}
  @keyframes rot{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(90deg);} }
  #rotateWarn p{color:var(--text-dim); font-size:14px; margin:0;}
</style>
</head>
<body>

<div id="stage"><canvas id="game"></canvas></div>

<div id="vignette"></div>
<div id="flash"></div>
<div id="finisherBanner">FINISH!</div>

<div id="hud">
  <div id="hudTop">
    <div class="hud-chip" id="scoreChip"><div class="label">SCORE</div><div class="val num" id="scoreVal">0</div></div>
    <div class="hud-chip" id="distChip"><div class="label">DISTANCE</div><div class="val num" id="distVal">0 m</div></div>
    <div class="hud-chip" id="comboChip"><div class="label">COMBO</div><div class="val num" id="comboVal">0</div></div>
  </div>
  <div id="hpWrap"><div id="hpBar"></div></div>
</div>

<div class="overlay" id="titleScreen">
  <div class="panel">
    <h1 class="title-mark">BLADE <span>RUSH</span></h1>
    <div class="title-sub">블레이드 러시</div>
    <svg class="compass" width="130" height="130" viewBox="0 0 150 150">
      <circle cx="75" cy="75" r="60" fill="none" stroke="#2a2f42" stroke-width="1.5"/>
      <circle cx="75" cy="75" r="60" fill="none" stroke="var(--crimson)" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.6"/>
      <g fill="var(--text-dim)" font-family="Rajdhani" font-size="14" font-weight="700" text-anchor="middle">
        <text x="75" y="18">↑</text><text x="126" y="42">↗</text><text x="138" y="80">→</text>
        <text x="126" y="118">↘</text><text x="75" y="140">↓</text><text x="24" y="118">↙</text>
        <text x="12" y="80">←</text><text x="24" y="42">↖</text>
      </g>
      <circle cx="75" cy="75" r="5" fill="var(--gold)"/>
    </svg>
    <div class="rules">
      <div><b>세로모드</b> 3인칭 시점, 캐릭터는 저절로 달립니다.</div>
      <div>적이 저 멀리서 달려오다가 <b>공격범위</b>에 들어오면 방향 패턴이 뜹니다. <b>제한시간</b> 안에 화면을 긋거나 탭해 완성하세요.</div>
      <div>여러 적을 <b>연속으로 클린</b>하면 슬로모션 <b>피니셔</b>가 터집니다.</div>
    </div>
    <button class="btn" id="startBtn">달리기 시작</button>
  </div>
</div>

<div class="overlay hidden" id="gameOverScreen">
  <div class="panel">
    <div class="go-title">쓰러졌다...</div>
    <div class="stat-row"><span>SCORE</span><b class="num" id="finalScore">0</b></div>
    <div class="stat-row"><span>DISTANCE</span><b class="num" id="finalDist">0 m</b></div>
    <div class="stat-row"><span>MAX COMBO</span><b class="num" id="finalCombo">0</b></div>
    <div class="stat-row"><span>BEST SCORE</span><b class="num" id="bestScore">0</b></div>
    <button class="btn" id="retryBtn">다시 도전</button>
  </div>
</div>

<div id="rotateWarn"><div class="icon">📱</div><p>세로모드에서만 플레이할 수 있어요.<br>휴대폰을 세로로 돌려주세요.</p></div>

<script>
(function(){
"use strict";

/* ============================== CONFIG ============================== */

const DIR_ICON = { right:'→', downright:'↘', down:'↓', downleft:'↙', left:'←', upleft:'↖', up:'↑', upright:'↗', tap:'○' };
const DIR_ORDER = ['right','downright','down','downleft','left','upleft','up','upright'];

const ENEMY_TYPES = {
  soldier:  { name:'일반병', color:'#9aa2b5', pattern:['right'],                     timeLimit:1.55, dmg:8,  score:100, unlock:0 },
  spearman: { name:'창병',   color:'#4fd1c5', pattern:['down'],                      timeLimit:1.45, dmg:9,  score:110, unlock:0 },
  assassin: { name:'암살자', color:'#b085f5', pattern:['downright'],                 timeLimit:1.30, dmg:10, score:130, unlock:150 },
  archer:   { name:'궁수',   color:'#e0c34c', pattern:['left','right'],              timeLimit:1.90, dmg:11, score:160, unlock:300 },
  mage:     { name:'마법사', color:'#63b3ff', pattern:['tap'],                       timeLimit:1.35, dmg:10, score:140, unlock:450, isTap:true },
  devil:    { name:'악마',   color:'#ef4459', pattern:['downright','upright'],       timeLimit:2.00, dmg:14, score:200, unlock:650 },
  bat:      { name:'박쥐',   color:'#8f7fe0', pattern:['tap','tap','tap'],           timeLimit:1.90, dmg:9,  score:150, unlock:800, isTap:true },
  golem:    { name:'골렘',   color:'#c08552', pattern:['right','down','left','up'],  timeLimit:3.10, dmg:16, score:260, unlock:1000 }
};

const PLAYER_MAX_HP = 100;
const TAP_TARGET_RADIUS = 46;
const SWIPE_MIN_DIST = 22;

/* ---- 3rd-person perspective (Temple-Run style, behind-character view) ---- */
const HORIZON_Y_RATIO = 0.34;   // vanishing point
const CONTACT_Y_RATIO = 0.80;   // where enemies reach the player / attack line sits at u=0.5 of this
const EASE_POW = 2.25;
const MIN_SCALE = 0.10;
const MAX_SCALE = 1.55;

/* ============================== CANVAS / SIZE ============================== */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let orientationBlocked = false;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  checkOrientation();
}
function checkOrientation(){
  orientationBlocked = window.innerWidth > window.innerHeight;
  document.getElementById('rotateWarn').classList.toggle('show', orientationBlocked);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
resize();

/* ============================== STATE ============================== */

let gameState = 'title';
let score = 0, distance = 0, combo = 0, maxCombo = 0, hp = PLAYER_MAX_HP;
let bestScore = 0;
try { bestScore = parseInt(localStorage.getItem('bladerush_best')||'0',10) || 0; } catch(e){ bestScore = 0; }

let queue = [];
let activeEnemy = null;
let dyingEnemies = [];
let wave = null;
let lastBossMilestone = 0;
let spawnCooldown = 1.2;

let timeScale = 1;
let slowmoUntilReal = 0;

let particles = [];
let floatingTexts = [];

let pointerActive = false;
let startX=0, startY=0, startT=0;
let trail = [];
let lastTapPos = {x:0,y:0};

let playerAnim = { bob:0, slashT:-1, hitT:-1 };

let running = false;
let lastFrameReal = 0;

/* ============================== UTIL ============================== */

function rand(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function now(){ return performance.now(); }

function getGestureDirection(dx,dy,dist){
  if(dist < SWIPE_MIN_DIST) return 'tap';
  let angle = Math.atan2(dy,dx) * 180/Math.PI;
  angle = (angle + 360) % 360;
  const idx = Math.round(angle/45) % 8;
  return DIR_ORDER[idx];
}

/* ---- perspective projection: u in [0,1], 0 = far horizon, 1 = contact point at player ---- */
function posForU(u){
  const horizonY = H*HORIZON_Y_RATIO;
  const contactY = H*CONTACT_Y_RATIO;
  const e = Math.pow(clamp(u,0,1), EASE_POW);
  return { y: horizonY + (contactY-horizonY)*e, scale: MIN_SCALE + (MAX_SCALE-MIN_SCALE)*e };
}

/* ============================== GAME FLOW ============================== */

function resetGame(){
  score=0; distance=0; combo=0; maxCombo=0; hp=PLAYER_MAX_HP;
  queue=[]; activeEnemy=null; dyingEnemies=[]; wave=null; lastBossMilestone=0; spawnCooldown=1.0;
  timeScale=1; slowmoUntilReal=0;
  particles=[]; floatingTexts=[];
  playerAnim={bob:0, slashT:-1, hitT:-1};
  updateHUD();
}

function startGame(){
  resetGame();
  gameState='playing';
  document.getElementById('titleScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  lastFrameReal = now();
  try{
    if(canvas.requestFullscreen) canvas.requestFullscreen().catch(()=>{});
    if(screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(()=>{});
  }catch(e){}
  if(!running){ running=true; requestAnimationFrame(loop); }
}

function gameOver(){
  gameState='gameover';
  if(score > bestScore){
    bestScore = score;
    try{ localStorage.setItem('bladerush_best', String(bestScore)); }catch(e){}
  }
  document.getElementById('finalScore').textContent = Math.floor(score);
  document.getElementById('finalDist').textContent = Math.floor(distance)+' m';
  document.getElementById('finalCombo').textContent = maxCombo;
  document.getElementById('bestScore').textContent = Math.floor(bestScore);
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

/* ============================== SPAWNING ============================== */

function unlockedTypes(){ return Object.keys(ENEMY_TYPES).filter(k => distance >= ENEMY_TYPES[k].unlock); }
function difficultyFactor(){ return clamp(1 - distance/6000, 0.72, 1); }

function makeEnemyRuntime(typeKey, isBoss){
  const base = ENEMY_TYPES[typeKey];
  const tl = Math.max(0.65, base.timeLimit * difficultyFactor());
  return {
    typeKey, name:base.name, color:base.color, isTap: !!base.isTap,
    pattern: base.pattern.slice(),
    timeLimit: tl, timer: tl,
    dmg: base.dmg, scoreVal: base.score,
    stepIndex:0, state:'queued', isBoss: !!isBoss,
    tapTarget:null, deathT:0,
    phase:'approach', approachDuration: (isBoss? rand(1.5,1.9) : rand(0.8,1.3)), approachTimer:0,
    xJitter: rand(-14,14), uAtResolve:0
  };
}

function makeBossRuntime(){
  const len = 6 + Math.floor(Math.random()*3);
  const dirs = [];
  for(let i=0;i<len;i++){
    let d;
    do { d = Math.random()<0.15 ? 'tap' : pick(DIR_ORDER); } while(d===dirs[dirs.length-1]);
    dirs.push(d);
  }
  const tl = Math.max(4.2, len*0.85*difficultyFactor()+1.5);
  const r = makeEnemyRuntime('soldier', true);
  r.typeKey='boss'; r.name='보스'; r.color='#ff3b57'; r.isTap=false;
  r.pattern=dirs; r.timeLimit=tl; r.timer=tl; r.dmg=24; r.scoreVal=900+len*60;
  r.approachDuration = rand(1.6,2.0);
  return r;
}

function spawnWave(){
  const bossMile = Math.floor(distance/500);
  if(bossMile > lastBossMilestone && bossMile>0){
    lastBossMilestone = bossMile;
    const boss = makeBossRuntime();
    queue.push(boss);
    wave = { size:1, allGood:true, usedTime:0, budget: boss.timeLimit*1.1, isBoss:true };
    activateNext();
    spawnCooldown = 3.4;
    return;
  }

  const pool = unlockedTypes();
  let size = 1;
  const r = Math.random();
  if(distance>250){ if(r<0.15) size=3; else if(r<0.45) size=2; else size=1; }
  else if(distance>80){ if(r<0.3) size=2; }

  const enemies = [];
  let budget = 0;
  for(let i=0;i<size;i++){
    const t = pick(pool);
    const e = makeEnemyRuntime(t,false);
    enemies.push(e);
    budget += e.timeLimit;
  }
  queue.push(...enemies);
  wave = { size, allGood:true, usedTime:0, budget: budget*0.88, isBoss:false };
  activateNext();

  const base = clamp(2.4 - distance/2600, 1.0, 2.4);
  spawnCooldown = base + rand(-0.15,0.15);
}

function activateNext(){
  if(activeEnemy) return;
  if(queue.length===0){ resolveWaveIfDone(); return; }
  const e = queue.shift();
  e.state='active';
  e.phase='approach';
  e.approachTimer=e.approachDuration;
  e.stepIndex=0;
  e.timer=e.timeLimit;
  activeEnemy = e;
}

function assignTapTarget(e){
  const x = rand(W*0.28, W*0.72);
  const y = rand(H*0.30, H*(HORIZON_Y_RATIO+0.30));
  e.tapTarget = {x, y, born: now()};
}

function resolveWaveIfDone(){
  if(!wave) return;
  if(wave.size>=2 && wave.allGood && wave.usedTime <= wave.budget) triggerFinisher(wave.size);
  wave = null;
}

/* ============================== FINISHER / FX ============================== */

function triggerFinisher(size){
  score += 220*size;
  slowmoUntilReal = now() + 900;
  flashScreen('gold');
  showBanner();
}
function showBanner(){
  const el = document.getElementById('finisherBanner');
  el.style.transition='none'; el.style.opacity='0'; el.style.transform='translate(-50%,-50%) scale(0.5)';
  requestAnimationFrame(()=>{
    el.style.transition='transform .28s cubic-bezier(.2,1.4,.4,1), opacity .2s';
    el.style.opacity='1'; el.style.transform='translate(-50%,-50%) scale(1)';
    setTimeout(()=>{ el.style.transition='opacity .5s'; el.style.opacity='0'; }, 650);
  });
}
function flashScreen(kind){
  const flash = document.getElementById('flash');
  flash.style.background = kind==='gold' ? 'radial-gradient(circle, rgba(240,196,25,0.9), rgba(240,196,25,0))' : '#fff';
  flash.style.transition='none'; flash.style.opacity='0.85';
  requestAnimationFrame(()=>{ flash.style.transition='opacity .35s ease-out'; flash.style.opacity='0'; });
}
function damageVignette(){
  const v = document.getElementById('vignette');
  v.style.boxShadow = 'inset 0 0 120px rgba(239,43,77,0.65)';
  setTimeout(()=>{ v.style.boxShadow='inset 0 0 0 rgba(239,43,77,0)'; }, 300);
}
function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2, spd = rand(60,220);
    particles.push({ x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:1, maxLife: rand(0.35,0.7), color, size: rand(2,4.5) });
  }
}
function spawnFloatText(x,y,text,color){ floatingTexts.push({x,y,text,color,life:1, vy:-55}); }

/* ============================== INPUT ============================== */

function onGestureInput(dir, releasePos){
  if(gameState!=='playing' || !activeEnemy || activeEnemy.phase!=='active') return;
  const step = activeEnemy.pattern[activeEnemy.stepIndex];
  let ok = false;
  if(step==='tap'){
    if(dir==='tap' && activeEnemy.tapTarget){
      const dd = Math.hypot(releasePos.x-activeEnemy.tapTarget.x, releasePos.y-activeEnemy.tapTarget.y);
      ok = dd <= TAP_TARGET_RADIUS;
    }
  } else { ok = (dir===step); }
  if(ok) advanceStep(); else failEnemy('wrong');
}

function advanceStep(){
  activeEnemy.stepIndex++;
  if(activeEnemy.stepIndex >= activeEnemy.pattern.length) succeedEnemy();
  else if(activeEnemy.pattern[activeEnemy.stepIndex]==='tap') assignTapTarget(activeEnemy);
}

function judgementFor(ratio){
  if(ratio<=0.40) return {label:'PERFECT', color:'#f0c419', mult:1.5};
  if(ratio<=0.75) return {label:'GOOD', color:'#39d98a', mult:1.0};
  return {label:'LATE', color:'#8a94a6', mult:0.7};
}

function currentEnemyScreenPos(e){
  let u;
  if(e.phase==='approach') u = clamp(1 - e.approachTimer/e.approachDuration,0,1) * 0.5;
  else if(e.phase==='active') u = 0.5 + clamp((e.timeLimit-e.timer)/e.timeLimit,0,1)*0.5;
  else u = e.uAtResolve;
  const pos = posForU(u);
  return { x: W/2 + e.xJitter*pos.scale, y: pos.y, scale: pos.scale, u };
}

function succeedEnemy(){
  const e = activeEnemy;
  const used = e.timeLimit - e.timer;
  const ratio = clamp(used / e.timeLimit, 0, 1);
  const judge = judgementFor(ratio);

  const mult = 1 + Math.floor(combo/5)*0.1;
  score += e.scoreVal * judge.mult * mult;
  combo++;
  if(combo>maxCombo) maxCombo=combo;
  if(wave) wave.usedTime += used;

  const pos = currentEnemyScreenPos(e);
  spawnParticles(pos.x,pos.y, judge.color, e.isBoss?36:18);
  spawnFloatText(pos.x,pos.y-40*pos.scale-10, judge.label, judge.color);
  playerAnim.slashT = 0;
  if(judge.label==='PERFECT') flashScreen('white');

  e.state='dead-success'; e.phase='dead'; e.deathT=0; e.uAtResolve=pos.u;
  dyingEnemies.push(e);

  activeEnemy = null;
  setTimeout(()=>{ if(gameState==='playing') activateNext(); }, e.isBoss?260:140);
  updateHUD();
}

function failEnemy(kind){
  const e = activeEnemy;
  if(!e) return;
  const dmg = e.dmg * (kind==='wrong'?1.35:1);
  hp = clamp(hp - dmg, 0, PLAYER_MAX_HP);
  combo = 0;
  if(wave) wave.allGood=false;

  const pos = currentEnemyScreenPos(e);
  spawnFloatText(pos.x,pos.y-40*pos.scale-10, kind==='wrong'?'WRONG':'MISS', '#ef2b4d');
  playerAnim.hitT = 0;
  damageVignette();

  e.state='dead-fail'; e.phase='dead'; e.deathT=0; e.uAtResolve=pos.u;
  dyingEnemies.push(e);

  activeEnemy = null;
  updateHUD();

  if(hp<=0){ setTimeout(gameOver, 260); return; }
  setTimeout(()=>{ if(gameState==='playing') activateNext(); }, 200);
}

/* ---- pointer handlers ---- */
function pointerDown(x,y){
  if(gameState!=='playing') return;
  pointerActive=true; startX=x; startY=y; startT=now(); trail=[{x,y,t:startT}];
}
function pointerMove(x,y){ if(!pointerActive) return; trail.push({x,y,t:now()}); if(trail.length>40) trail.shift(); }
function pointerUp(x,y){
  if(!pointerActive) return;
  pointerActive=false;
  const dx=x-startX, dy=y-startY, dist=Math.hypot(dx,dy);
  const dir = getGestureDirection(dx,dy,dist);
  lastTapPos = {x,y};
  onGestureInput(dir, lastTapPos);
}
canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); pointerDown(e.clientX,e.clientY); }, {passive:false});
canvas.addEventListener('pointermove', e=>{ if(pointerActive){ e.preventDefault(); pointerMove(e.clientX,e.clientY);} }, {passive:false});
window.addEventListener('pointerup', e=>{ if(pointerActive) pointerUp(e.clientX,e.clientY); });
window.addEventListener('pointercancel', ()=>{ pointerActive=false; trail=[]; });

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

/* ============================== HUD ============================== */

function updateHUD(){
  document.getElementById('scoreVal').textContent = Math.floor(score);
  document.getElementById('distVal').textContent = Math.floor(distance)+' m';
  const comboChip = document.getElementById('comboChip');
  document.getElementById('comboVal').textContent = combo;
  if(combo>=2) comboChip.classList.add('show'); else comboChip.classList.remove('show');
  document.getElementById('hpBar').style.width = clamp(hp/PLAYER_MAX_HP*100,0,100)+'%';
}

/* ============================== UPDATE ============================== */

function update(dtReal){
  const slomoActive = now() < slowmoUntilReal;
  timeScale = slomoActive ? 0.32 : 1;
  const dt = dtReal * timeScale;

  if(gameState==='playing'){
    distance += dt * 16;
    playerAnim.bob += dt*8;

    spawnCooldown -= dt;
    if(spawnCooldown<=0 && !wave) spawnWave();

    if(activeEnemy){
      if(activeEnemy.phase==='approach'){
        activeEnemy.approachTimer -= dt;
        if(activeEnemy.approachTimer<=0){
          activeEnemy.phase='active';
          activeEnemy.timer=activeEnemy.timeLimit;
          activeEnemy.stepIndex=0;
          if(activeEnemy.pattern[0]==='tap') assignTapTarget(activeEnemy);
        }
      } else if(activeEnemy.phase==='active'){
        activeEnemy.timer -= dt;
        if(activeEnemy.timer<=0) failEnemy('miss');
      }
    }

    if(playerAnim.slashT>=0){ playerAnim.slashT += dtReal*3.2; if(playerAnim.slashT>1) playerAnim.slashT=-1; }
    if(playerAnim.hitT>=0){ playerAnim.hitT += dtReal*3.2; if(playerAnim.hitT>1) playerAnim.hitT=-1; }

    updateHUD();
  }

  for(let i=dyingEnemies.length-1;i>=0;i--){
    dyingEnemies[i].deathT += dtReal*3.2;
    if(dyingEnemies[i].deathT>1) dyingEnemies.splice(i,1);
  }
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dtReal/p.maxLife;
    p.x += p.vx*dtReal; p.y += p.vy*dtReal; p.vy += 340*dtReal;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=floatingTexts.length-1;i>=0;i--){
    const f = floatingTexts[i];
    f.life -= dtReal*0.9; f.y += f.vy*dtReal;
    if(f.life<=0) floatingTexts.splice(i,1);
  }
}

/* ============================== RENDER: SCENE ============================== */

function drawBackground(){
  const horizonY = H*HORIZON_Y_RATIO;
  const sky = ctx.createLinearGradient(0,0,0,horizonY);
  sky.addColorStop(0,'#0a0d1e'); sky.addColorStop(1,'#171b30');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,horizonY);

  // distant silhouettes flanking the road
  ctx.fillStyle='rgba(28,32,54,0.9)';
  const off = (distance*0.4)%140;
  for(let x=-off; x<W+140; x+=140){
    const h = 30+((Math.sin(x*0.02)+1)/2)*46;
    ctx.beginPath();
    ctx.moveTo(x,horizonY); ctx.lineTo(x+45,horizonY-h); ctx.lineTo(x+90,horizonY);
    ctx.closePath(); ctx.fill();
  }

  const ground = ctx.createLinearGradient(0,horizonY,0,H);
  ground.addColorStop(0,'#1a1d33'); ground.addColorStop(1,'#07080f');
  ctx.fillStyle=ground; ctx.fillRect(0,horizonY,W,H-horizonY);

  drawRoad(horizonY);
}

function drawRoad(horizonY){
  const topHalf = W*0.035, botHalf = W*0.62;
  const cx = W/2;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx-topHalf, horizonY);
  ctx.lineTo(cx+topHalf, horizonY);
  ctx.lineTo(cx+botHalf, H);
  ctx.lineTo(cx-botHalf, H);
  ctx.closePath();
  const rg = ctx.createLinearGradient(0,horizonY,0,H);
  rg.addColorStop(0,'#20233a'); rg.addColorStop(0.6,'#181a2c'); rg.addColorStop(1,'#0d0e18');
  ctx.fillStyle=rg; ctx.fill();

  ctx.strokeStyle='rgba(239,43,77,0.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx-topHalf,horizonY); ctx.lineTo(cx-botHalf,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+topHalf,horizonY); ctx.lineTo(cx+botHalf,H); ctx.stroke();

  // scrolling perspective ties
  ctx.clip();
  const tieCount = 14;
  const spacing = 1/tieCount;
  const scrollOff = (distance*0.09) % spacing;
  ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=2;
  for(let i=-1;i<=tieCount;i++){
    const u = i*spacing + scrollOff;
    if(u<0||u>1) continue;
    const p = posForU(u);
    const halfW = topHalf + (botHalf-topHalf)*Math.pow(u,EASE_POW);
    ctx.beginPath();
    ctx.moveTo(cx-halfW, p.y); ctx.lineTo(cx+halfW, p.y);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---- player (behind view, 3rd person) ---- */

function drawPlayer(){
  const cx = W/2;
  const baseY = H*0.965;
  const bob = Math.sin(playerAnim.bob)*3.5;
  let sway = Math.sin(playerAnim.bob*0.5)*3;
  let tilt = 0;
  if(playerAnim.hitT>=0) tilt = Math.sin(playerAnim.hitT*Math.PI)*0.14;

  ctx.save();
  ctx.translate(cx+sway, baseY+bob);
  ctx.rotate(tilt);

  // ground shadow
  ctx.save(); ctx.translate(0,10); ctx.scale(1,0.22);
  ctx.beginPath(); ctx.arc(0,0,58,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fill();
  ctx.restore();

  // cloak
  ctx.fillStyle='#1c2036';
  ctx.beginPath();
  ctx.moveTo(-46,-70); ctx.quadraticCurveTo(-70,10,-30,30); ctx.lineTo(30,30);
  ctx.quadraticCurveTo(70,10,46,-70); ctx.closePath(); ctx.fill();

  // shoulders / back
  ctx.fillStyle='#2b3350';
  ctx.beginPath(); ctx.roundRect(-40,-98,80,72,18); ctx.fill();

  // head (back of head)
  ctx.fillStyle='#181b2a';
  ctx.beginPath(); ctx.arc(0,-118,26,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#12141f';
  ctx.beginPath(); ctx.roundRect(-16,-142,32,20,10); ctx.fill();

  // sword arm (right side, held ready) + slash swing
  const slashActive = playerAnim.slashT>=0;
  const swAngle = slashActive ? (-1.15 + playerAnim.slashT*1.9) : -0.95;
  ctx.save();
  ctx.translate(38,-60);
  ctx.rotate(swAngle);
  ctx.fillStyle='#394463';
  ctx.beginPath(); ctx.roundRect(-8,-8,16,46,8); ctx.fill();
  ctx.fillStyle = slashActive ? '#fff6cf' : '#c7cfe0';
  ctx.fillRect(-4,-64,8,58);
  ctx.fillStyle='#8a6a2f';
  ctx.fillRect(-9,-10,18,10);
  ctx.restore();

  ctx.restore();
}

/* ---- enemies ---- */

function drawEnemyAt(e, x, y, scale, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x,y);
  ctx.scale(scale,scale);

  ctx.save(); ctx.translate(0,40); ctx.scale(1,0.25);
  ctx.beginPath(); ctx.arc(0,0, e.isBoss?40:24,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.42)'; ctx.fill();
  ctx.restore();

  const r = e.isBoss? 32:22;
  const grad = ctx.createRadialGradient(0,0,2,0,0,r*1.5);
  grad.addColorStop(0, e.color); grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(0,2,r*1.5,0,Math.PI*2); ctx.fill();

  ctx.fillStyle=e.color;
  ctx.beginPath(); ctx.roundRect(-r*0.6,-r*0.15,r*1.2,r*1.2,7); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-r*0.55, r*0.52,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.font = `700 ${e.isBoss?16:12}px Rajdhani, sans-serif`;
  ctx.textAlign='center';
  ctx.fillText(e.name, 0, r+20);
  ctx.restore();
}

function drawPatternRow(cx, cy, e, scale){
  const n = e.pattern.length;
  const box = (e.isBoss? 26:22) * Math.max(scale,0.55);
  const gap = 6*Math.max(scale,0.55);
  const totalW = n*box + (n-1)*gap;
  let x0 = cx - totalW/2;
  for(let i=0;i<n;i++){
    const bx = x0 + i*(box+gap);
    const done = i<e.stepIndex, cur = i===e.stepIndex;
    ctx.save();
    ctx.translate(bx+box/2, cy);
    ctx.beginPath(); ctx.roundRect(-box/2,-box/2, box, box, 5);
    if(cur){ ctx.fillStyle='rgba(240,196,25,0.20)'; ctx.fill(); ctx.strokeStyle='#f0c419'; ctx.lineWidth=2; ctx.stroke(); }
    else if(done){ ctx.fillStyle='rgba(57,217,138,0.18)'; ctx.fill(); ctx.strokeStyle='#39d98a'; ctx.lineWidth=1.5; ctx.stroke(); }
    else { ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1; ctx.stroke(); }
    ctx.fillStyle = done? '#39d98a' : (cur? '#f0c419' : 'rgba(255,255,255,0.75)');
    ctx.font=`700 ${box*0.6}px Rajdhani, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(DIR_ICON[e.pattern[i]], 0, 1);
    ctx.restore();
  }
}

function drawTimerBar(cx, cy, e, scale){
  const w = (e.isBoss?150:100) * Math.max(scale,0.55), h=5;
  const ratio = clamp(e.timer/e.timeLimit,0,1);
  ctx.save(); ctx.translate(cx-w/2, cy);
  ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.roundRect(0,0,w,h,3); ctx.fill();
  const col = ratio>0.5? '#39d98a' : ratio>0.22? '#f0c419' : '#ef2b4d';
  ctx.fillStyle=col; ctx.beginPath(); ctx.roundRect(0,0,w*ratio,h,3); ctx.fill();
  ctx.restore();
}

function drawTapTarget(e){
  const t = e.tapTarget;
  const age = (now()-t.born)/1000;
  const pulse = 1 + Math.sin(age*8)*0.08;
  ctx.save(); ctx.translate(t.x,t.y);
  ctx.strokeStyle='#63b3ff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(0,0, TAP_TARGET_RADIUS*pulse, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(99,179,255,0.18)'; ctx.beginPath(); ctx.arc(0,0, TAP_TARGET_RADIUS*0.8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='700 20px Rajdhani, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('○', 0, 1);
  ctx.restore();
}

function drawActiveEnemy(){
  const e = activeEnemy;
  const pos = currentEnemyScreenPos(e);
  drawEnemyAt(e, pos.x, pos.y, pos.scale, 1);

  if(e.phase==='active'){
    drawPatternRow(pos.x, pos.y - (e.isBoss?74:56)*Math.max(pos.scale,0.55), e, pos.scale);
    drawTimerBar(pos.x, pos.y - (e.isBoss?92:74)*Math.max(pos.scale,0.55), e, pos.scale);
    if(e.pattern[e.stepIndex]==='tap' && e.tapTarget) drawTapTarget(e);
  } else {
    // approaching: small "!" cue right as it nears the attack line
    if(pos.u>0.38){
      ctx.save();
      ctx.globalAlpha = clamp((pos.u-0.38)/0.12,0,1);
      ctx.fillStyle='#fff';
      ctx.font=`700 ${18*Math.max(pos.scale,0.5)}px Rajdhani, sans-serif`;
      ctx.textAlign='center';
      ctx.fillText('!', pos.x, pos.y - 40*pos.scale);
      ctx.restore();
    }
  }
}

function drawDyingEnemies(){
  dyingEnemies.forEach(e=>{
    const pos = posForU(e.uAtResolve);
    const success = e.state==='dead-success';
    const alpha = clamp(1-e.deathT,0,1);
    const scaleMul = success ? 1+e.deathT*0.6 : 1-e.deathT*0.25;
    drawEnemyAt(e, W/2+e.xJitter*pos.scale, pos.y, pos.scale*Math.max(scaleMul,0.1), alpha);
  });
}

function drawQueuedPreview(){
  const horizonY = H*HORIZON_Y_RATIO;
  queue.slice(0,3).forEach((e,i)=>{
    const y = horizonY - 4 - i*3;
    const x = W/2 + (i-1)*26;
    drawEnemyAt(e, x, y, MIN_SCALE*1.6, 0.5);
  });
}

function drawTrail(){
  const cutoff = now()-160;
  const pts = trail.filter(p=>p.t>=cutoff);
  if(pts.length<2) return;
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  for(let i=1;i<pts.length;i++){
    const a = (i/pts.length);
    ctx.strokeStyle = `rgba(255,92,122,${a*0.9})`;
    ctx.lineWidth = 3+a*7;
    ctx.beginPath(); ctx.moveTo(pts[i-1].x, pts[i-1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
  }
  ctx.restore();
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha = clamp(p.life,0,1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawFloatingTexts(){
  floatingTexts.forEach(f=>{
    ctx.globalAlpha = clamp(f.life,0,1);
    ctx.fillStyle = f.color;
    ctx.font='800 24px Rajdhani, sans-serif';
    ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=4;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha=1;
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  if(gameState==='playing' || gameState==='gameover'){
    drawQueuedPreview();
    drawDyingEnemies();
    if(activeEnemy) drawActiveEnemy();
    drawPlayer();
    drawParticles();
    drawFloatingTexts();
    drawTrail();
  } else {
    drawPlayer();
  }
}

/* ============================== LOOP ============================== */

function loop(t){
  if(!lastFrameReal) lastFrameReal=t;
  let dtReal = (t-lastFrameReal)/1000;
  dtReal = Math.min(dtReal, 0.05);
  lastFrameReal = t;

  if(!orientationBlocked){
    update(dtReal);
    render();
  }
  requestAnimationFrame(loop);
}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
    this.beginPath();
    this.moveTo(x+r.tl,y);
    this.lineTo(x+w-r.tr,y); this.arcTo(x+w,y,x+w,y+r.tr,r.tr);
    this.lineTo(x+w,y+h-r.br); this.arcTo(x+w,y+h,x+w-r.br,y+h,r.br);
    this.lineTo(x+r.bl,y+h); this.arcTo(x,y+h,x,y+h-r.bl,r.bl);
    this.lineTo(x,y+r.tl); this.arcTo(x,y,x+r.tl,y,r.tl);
    this.closePath();
    return this;
  };
}

running = true;
requestAnimationFrame(loop);

})();
</script>
