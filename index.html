<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Touch Lab 3D — 물성 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#efe9df; --ink-dim:#9a9186;
    --stage:#17140f; --dish:#0e0c09; --line: rgba(239,233,223,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--stage);color:var(--ink);
    font-family:'Zen Kaku Gothic New','Space Grotesk',sans-serif;touch-action:none;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
    background: radial-gradient(120% 90% at 50% -10%, #221c14 0%, var(--stage) 55%);}
  header{flex:0 0 auto;padding:max(16px,env(safe-area-inset-top)) 20px 8px;display:flex;align-items:baseline;justify-content:space-between;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;letter-spacing:.18em;color:var(--ink-dim);text-transform:uppercase;}
  .material-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;}
  .material-index{font-variant-numeric:tabular-nums;color:var(--ink-dim);font-weight:500;}

  #switchRow{flex:0 0 auto;display:none;justify-content:center;gap:8px;padding:0 16px 6px;}
  #switchRow.show{display:flex;}
  .sw{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink-dim);
    font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:.03em;padding:7px 12px;border-radius:14px;cursor:pointer;}
  .sw.active{background:rgba(255,255,255,.09);color:var(--ink);border-color:rgba(255,255,255,.2);}

  main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:4px 16px;}
  #dish{position:relative;width:min(94vw,68vh,520px);height:min(94vw,68vh,520px);border-radius:30px;background:var(--dish);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.6),inset 0 -18px 40px rgba(0,0,0,.55),0 30px 60px -20px rgba(0,0,0,.6);
    overflow:hidden;}
  canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;letter-spacing:.06em;
    color:rgba(239,233,223,0.35);pointer-events:none;transition:opacity .6s ease;font-family:'Space Grotesk',sans-serif;}
  #dish.touched #hint{opacity:0;}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:.1em;color:var(--ink-dim);}

  footer{flex:0 0 auto;padding:6px 16px max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center;}
  #tabs{display:flex;gap:10px;background:rgba(255,255,255,0.035);border:1px solid var(--line);padding:8px;border-radius:22px;backdrop-filter:blur(6px);}
  .tab{appearance:none;border:none;cursor:pointer;width:64px;height:54px;border-radius:16px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px;background:transparent;color:var(--ink-dim);
    font-family:'Space Grotesk',sans-serif;font-size:10px;letter-spacing:.04em;transition:background .25s,color .25s,transform .15s;}
  .tab .swatch{width:20px;height:20px;border-radius:7px;box-shadow:inset 0 -3px 5px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.25);}
  .tab[data-m="butter"] .swatch{background:linear-gradient(155deg,#f7d67e,#caa03f);}
  .tab[data-m="wax"] .swatch{background:linear-gradient(155deg,#f4a6c8,#b24f7c);}
  .tab[data-m="keycap"] .swatch{background:linear-gradient(155deg,#3a3d44,#1a1c20);border:1px solid rgba(255,255,255,.08);}
  .tab.active{background:rgba(255,255,255,0.07);color:var(--ink);transform:translateY(-2px);}
  .tab:active{transform:scale(.94);}

  #soundToggle{position:absolute;top:max(16px,env(safe-area-inset-top));right:20px;width:32px;height:32px;border-radius:50%;
    border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink-dim);display:flex;align-items:center;
    justify-content:center;font-size:13px;cursor:pointer;z-index:5;}
  #soundToggle.off{color:#7a5a5a;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Touch Lab 3D</div>
    <div class="material-name"><span class="material-index" id="matIndex">01</span><span id="matName">Butter Wax</span></div>
  </header>

  <div id="switchRow">
    <button class="sw active" data-sw="red">적축 (Linear)</button>
    <button class="sw" data-sw="topre">무접점 (Silent)</button>
    <button class="sw" data-sw="blue">청축 (Clicky)</button>
  </div>

  <main>
    <button id="soundToggle" aria-label="sound">♪</button>
    <div id="dish">
      <canvas id="gl"></canvas>
      <div id="loading">Loading…</div>
      <div id="hint">눌러서 만져보세요</div>
    </div>
  </main>

  <footer>
    <div id="tabs">
      <button class="tab active" data-m="butter"><span class="swatch"></span>버터</button>
      <button class="tab" data-m="wax"><span class="swatch"></span>왁스볼</button>
      <button class="tab" data-m="keycap"><span class="swatch"></span>키캡</button>
    </div>
  </footer>
</div>

<script>
(() => {
  const dish = document.getElementById('dish');
  const glCanvas = document.getElementById('gl');
  const hint = document.getElementById('hint');
  const loadingEl = document.getElementById('loading');
  const matName = document.getElementById('matName');
  const matIndex = document.getElementById('matIndex');
  const soundBtn = document.getElementById('soundToggle');
  const switchRow = document.getElementById('switchRow');

  const META = {
    butter: { label:'Butter Wax', idx:'01' },
    wax:    { label:'Wax Ball',   idx:'02' },
    keycap: { label:'Keycap 3×3', idx:'03' }
  };
  let current = 'butter';
  let switchType = 'red'; // red | topre | blue

  // ---------------- Renderer / camera / scene ----------------
  let renderer, scene, camera;
  let width=0, height=0, dpr=Math.max(1, Math.min(2, window.devicePixelRatio||1));

  function initGL(){
    renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias:true, alpha:false });
    renderer.setPixelRatio(dpr);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
    resizeGL();
  }
  function resizeGL(){
    const rect = dish.getBoundingClientRect();
    width = rect.width; height = rect.height;
    renderer.setSize(width, height, false);
    camera.aspect = width/height;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resizeGL);

  function clearLights(){
    for (let i=scene.children.length-1;i>=0;i--){
      const c = scene.children[i];
      if (c.isLight) scene.remove(c);
    }
  }
  function addStudioLights(warm){
    clearLights();
    const amb = new THREE.AmbientLight(warm? 0x5a4c38 : 0x30343c, 0.9);
    scene.add(amb);
    const key = new THREE.DirectionalLight(warm? 0xfff2d8 : 0xdfe8ff, 1.15);
    key.position.set(2.2, 3.4, 2.6);
    scene.add(key);
    const fill = new THREE.DirectionalLight(warm? 0xffd9a0 : 0x99c9ff, 0.45);
    fill.position.set(-2.4, 1.2, -1.5);
    scene.add(fill);
    const rim = new THREE.PointLight(0xffffff, 0.35, 12);
    rim.position.set(0, 2.6, -2.6);
    scene.add(rim);
  }

  let currentGroup = null;
  function disposeGroup(g){
    if (!g) return;
    g.traverse(o=>{
      if (o.isMesh){
        o.geometry && o.geometry.dispose();
        const mats = Array.isArray(o.material)?o.material:[o.material];
        mats.forEach(m=>{ if(!m) return; for (const k in m){ const v=m[k]; if (v && v.isTexture) v.dispose(); } m.dispose && m.dispose(); });
      }
    });
    scene.remove(g);
  }

  // ---------------- Audio ----------------
  let actx=null, soundOn=true, noiseBuf=null;
  function ensureAudio(){
    if (actx) return;
    actx = new (window.AudioContext||window.webkitAudioContext)();
    const len = actx.sampleRate*1.0;
    noiseBuf = actx.createBuffer(1,len,actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
  }
  function noiseSrc(){ const s=actx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s; }

  let ambient=null;
  function startAmbient(){
    if (!soundOn) return; ensureAudio(); if (ambient) return;
    const src=noiseSrc(); const filt=actx.createBiquadFilter();
    filt.type='lowpass'; filt.frequency.value=260; filt.Q.value=0.6;
    const gain=actx.createGain(); gain.gain.value=0;
    src.connect(filt); filt.connect(gain); gain.connect(actx.destination); src.start();
    ambient={src,filt,gain};
  }
  function updateAmbient(intensity, mat){
    if (!ambient) return;
    const g = Math.min(0.16, intensity*0.22);
    ambient.gain.gain.setTargetAtTime(g, actx.currentTime, 0.03);
    const f = mat==='butter' ? (170+intensity*250) : (240+intensity*420);
    ambient.filt.frequency.setTargetAtTime(f, actx.currentTime, 0.05);
  }
  function stopAmbient(){
    if (!ambient) return;
    ambient.gain.gain.setTargetAtTime(0, actx.currentTime, 0.08);
    const a=ambient; ambient=null;
    setTimeout(()=>{ try{a.src.stop(); a.gain.disconnect(); a.filt.disconnect();}catch(e){} },300);
  }
  function playThud(strength, mat){
    if (!soundOn) return; ensureAudio();
    const t=actx.currentTime;
    const g=actx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(Math.min(0.5,0.15+strength*0.5), t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(mat==='butter'?0.28:0.16));
    g.connect(actx.destination);
    const osc=actx.createOscillator();
    osc.type = mat==='butter' ? 'sine' : 'triangle';
    osc.frequency.setValueAtTime(mat==='butter'?90:130, t);
    osc.frequency.exponentialRampToValueAtTime(mat==='butter'?55:70, t+0.15);
    osc.connect(g); osc.start(t); osc.stop(t+0.3);
    const src=noiseSrc(); const filt=actx.createBiquadFilter();
    filt.type='bandpass'; filt.frequency.value = mat==='butter'?400:900; filt.Q.value=0.8;
    const ng=actx.createGain();
    ng.gain.setValueAtTime(Math.min(0.35,strength*0.4), t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
    src.connect(filt); filt.connect(ng); ng.connect(actx.destination);
    src.start(t); src.stop(t+0.14);
  }
  function playCrackle(n){
    if (!soundOn) return; ensureAudio();
    const t=actx.currentTime;
    for (let i=0;i<n;i++){
      const dt = t + i*(0.015+Math.random()*0.02);
      const src=noiseSrc(); const filt=actx.createBiquadFilter();
      filt.type='highpass'; filt.frequency.value=1400+Math.random()*2200;
      const g=actx.createGain();
      g.gain.setValueAtTime(0.22+Math.random()*0.12, dt);
      g.gain.exponentialRampToValueAtTime(0.0001, dt+0.04+Math.random()*0.03);
      src.connect(filt); filt.connect(g); g.connect(actx.destination);
      src.start(dt); src.stop(dt+0.09);
    }
  }
  // switch sounds
  function playSwitch(type, down){
    if (!soundOn) return; ensureAudio();
    const t=actx.currentTime;
    if (type==='red'){
      // smooth deep thock, no click
      const osc=actx.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(down?150:190, t);
      osc.frequency.exponentialRampToValueAtTime(down?90:130, t+0.05);
      const g=actx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(down?0.32:0.18, t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
      osc.connect(g); g.connect(actx.destination); osc.start(t); osc.stop(t+0.1);
    } else if (type==='topre'){
      // soft muffled padded thock, lower + more filtered, longer decay
      const src=noiseSrc(); const filt=actx.createBiquadFilter();
      filt.type='lowpass'; filt.frequency.value = down?520:420; filt.Q.value=0.9;
      const g=actx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(down?0.28:0.14, t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
      src.connect(filt); filt.connect(g); g.connect(actx.destination);
      src.start(t); src.stop(t+0.18);
      const osc=actx.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(down?110:140,t);
      const g2=actx.createGain();
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.linearRampToValueAtTime(down?0.18:0.08,t+0.01);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      osc.connect(g2); g2.connect(actx.destination); osc.start(t); osc.stop(t+0.15);
    } else if (type==='blue'){
      // sharp plastic click, higher pitched, crisp transient (actuation + release both clicky)
      const osc=actx.createOscillator(); osc.type='square';
      osc.frequency.setValueAtTime(down?2600:3100, t);
      const g=actx.createGain();
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.035);
      osc.connect(g); g.connect(actx.destination); osc.start(t); osc.stop(t+0.04);
      const src=noiseSrc(); const filt=actx.createBiquadFilter();
      filt.type='highpass'; filt.frequency.value=2200;
      const ng=actx.createGain();
      ng.gain.setValueAtTime(0.25, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t+0.03);
      src.connect(filt); filt.connect(ng); ng.connect(actx.destination);
      src.start(t); src.stop(t+0.035);
    }
    if (navigator.vibrate) navigator.vibrate(down?(type==='blue'?6:10):5);
  }

  soundBtn.addEventListener('click', ()=>{
    soundOn=!soundOn;
    soundBtn.classList.toggle('off',!soundOn);
    soundBtn.textContent = soundOn?'♪':'×';
    if (!soundOn) stopAmbient();
  });

  // ---------------- Shared pointer utils ----------------
  const raycaster = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  function setPtrFromEvent(e){
    const rect = glCanvas.getBoundingClientRect();
    ptr.x = ((e.clientX-rect.left)/rect.width)*2-1;
    ptr.y = -((e.clientY-rect.top)/rect.height)*2+1;
  }

  // ==================================================================
  // BUTTER MODE
  // ==================================================================
  let butterMesh=null, butterGeom=null, butterRest=null, butterVel=null, butterPlane=null;
  let butterAutoRot=0;
  function buildButter(){
    const group = new THREE.Group();
    addStudioLights(true);
    scene.background = new THREE.Color(0x1c160f);

    const W=2.6, H=0.62, D=1.05, segX=34, segZ=16;
    butterGeom = new THREE.BoxGeometry(W,H,D,segX,2,segZ);
    butterRest = new Float32Array(butterGeom.attributes.position.count);
    butterVel = new Float32Array(butterGeom.attributes.position.count);
    const pos = butterGeom.attributes.position;
    for (let i=0;i<pos.count;i++) butterRest[i]=pos.getY(i);

    const sideMat = new THREE.MeshPhysicalMaterial({
      color:0xf3d888, roughness:0.42, metalness:0.0, clearcoat:0.35, clearcoatRoughness:0.3,
      sheen:1.0, sheenColor:0xfff1c2
    });
    const topMat = sideMat.clone();
    const botMat = sideMat.clone();
    butterMesh = new THREE.Mesh(butterGeom, [sideMat,sideMat,topMat,botMat,sideMat,sideMat]);
    butterMesh.position.y = H/2;
    group.add(butterMesh);

    // label decal (photo texture) sitting on top face
    const tex = new THREE.TextureLoader().load(LABEL_IMG_SRC);
    tex.encoding = THREE.sRGBEncoding;
    const labelMat = new THREE.MeshPhysicalMaterial({ map:tex, roughness:0.5, transparent:true, clearcoat:0.5 });
    const labelGeom = new THREE.PlaneGeometry(W*0.7, D*0.62);
    const label = new THREE.Mesh(labelGeom, labelMat);
    label.rotation.x = -Math.PI/2;
    label.position.set(0.05, H+0.006, 0);
    group.add(label);

    // dish plate under it
    const plate = new THREE.Mesh(
      new THREE.CylinderGeometry(2.0,2.0,0.05,48),
      new THREE.MeshStandardMaterial({color:0x14100a, roughness:0.9})
    );
    plate.position.y = -0.03;
    group.add(plate);

    // invisible raycast plane matching footprint (top face, generous)
    butterPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(W,D),
      new THREE.MeshBasicMaterial({visible:false})
    );
    butterPlane.rotation.x = -Math.PI/2;
    butterPlane.position.y = H;
    group.add(butterPlane);

    camera.position.set(0, 2.05, 2.75);
    camera.lookAt(0, 0.25, 0);
    return group;
  }
  function butterDent(localX, localZ, strength, radius){
    const pos = butterGeom.attributes.position;
    const halfH = 0.31;
    for (let i=0;i<pos.count;i++){
      const y0 = butterRest[i];
      if (y0 < halfH*0.5) continue; // only top-ish vertices
      const x = pos.getX(i), z = pos.getZ(i);
      const dx=x-localX, dz=z-localZ;
      const d2 = dx*dx+dz*dz;
      if (d2 > radius*radius*4) continue;
      const fall = Math.exp(-d2/(radius*radius*0.5));
      const target = y0 - strength*fall;
      if (target < pos.getY(i)) pos.setY(i, target);
    }
    pos.needsUpdate = true;
  }
  function butterStep(){
    const pos = butterGeom.attributes.position;
    const stiffness=0.05, damping=0.86;
    for (let i=0;i<pos.count;i++){
      const y=pos.getY(i), rest=butterRest[i];
      let v = butterVel[i];
      v += (rest-y)*stiffness;
      v *= damping;
      pos.setY(i, y+v);
      butterVel[i]=v;
    }
    pos.needsUpdate = true;
    butterGeom.computeVertexNormals();
  }

  // ==================================================================
  // WAX BALL MODE
  // ==================================================================
  let waxMesh=null, waxTex=null, waxCtx=null, waxCanvas=null, waxHits=0, waxChips=[];
  const WAX_TEXSIZE=512;
  const WAX_COAT = '#f2a6c9';
  const WAX_COAT_DARK = '#c56f96';
  const WAX_CORE = '#fff7ea';
  function buildWax(){
    const group = new THREE.Group();
    addStudioLights(false);
    scene.background = new THREE.Color(0x120e16);

    waxCanvas = document.createElement('canvas');
    waxCanvas.width = WAX_TEXSIZE; waxCanvas.height = WAX_TEXSIZE/2*2; // 512x512 equirect-ish (simplify: square, use uv directly)
    waxCanvas.height = WAX_TEXSIZE;
    waxCtx = waxCanvas.getContext('2d');
    paintCoat();
    waxTex = new THREE.CanvasTexture(waxCanvas);
    waxTex.encoding = THREE.sRGBEncoding;
    waxHits = 0; waxChips = [];

    const geom = new THREE.SphereGeometry(0.95, 64, 48);
    const mat = new THREE.MeshPhysicalMaterial({ map:waxTex, roughness:0.55, clearcoat:0.4, clearcoatRoughness:0.35 });
    waxMesh = new THREE.Mesh(geom, mat);
    waxMesh.position.y = 0.98;
    group.add(waxMesh);

    const plate = new THREE.Mesh(
      new THREE.CylinderGeometry(1.7,1.7,0.05,48),
      new THREE.MeshStandardMaterial({color:0x120e14, roughness:0.9})
    );
    group.add(plate);

    camera.position.set(0, 1.55, 2.6);
    camera.lookAt(0, 0.7, 0);
    return group;
  }
  function paintCoat(){
    const c = waxCtx, s = WAX_TEXSIZE;
    const g = c.createLinearGradient(0,0,0,s);
    g.addColorStop(0, '#f6b9d4');
    g.addColorStop(1, WAX_COAT);
    c.fillStyle = g; c.fillRect(0,0,s,s);
    // subtle mottled noise
    c.globalAlpha = 0.06;
    for (let i=0;i<300;i++){
      c.fillStyle = Math.random()>0.5? '#ffffff':'#000000';
      const r = 6+Math.random()*24;
      c.beginPath(); c.arc(Math.random()*s, Math.random()*s, r, 0, Math.PI*2); c.fill();
    }
    c.globalAlpha = 1;
  }
  function waxDentAt(u,v,strength){
    const c=waxCtx, s=WAX_TEXSIZE;
    const cx=u*s, cy=(1-v)*s;
    waxHits++;
    // reveal core progressively with jittery blotch (chip breaking away)
    const r = 10 + Math.min(46, waxHits*1.6) * strength;
    c.save();
    c.beginPath();
    const spikes = 9;
    for (let i=0;i<spikes;i++){
      const ang = (i/spikes)*Math.PI*2;
      const rr = r*(0.65+Math.random()*0.7);
      const px = cx+Math.cos(ang)*rr, py=cy+Math.sin(ang)*rr;
      if (i===0) c.moveTo(px,py); else c.lineTo(px,py);
    }
    c.closePath();
    c.fillStyle = waxHits>2 ? WAX_CORE : WAX_COAT_DARK;
    c.fill();
    c.restore();
    // fine crack lines radiating
    c.strokeStyle = 'rgba(120,40,70,0.5)';
    c.lineWidth = 1.4;
    for (let i=0;i<5;i++){
      const ang = Math.random()*Math.PI*2;
      const len = r*(1.3+Math.random());
      c.beginPath();
      c.moveTo(cx,cy);
      c.lineTo(cx+Math.cos(ang)*len, cy+Math.sin(ang)*len);
      c.stroke();
    }
    waxTex.needsUpdate = true;
    return r;
  }
  function spawnChips(worldPos, count){
    for (let i=0;i<count;i++){
      const geo = new THREE.PlaneGeometry(0.05+Math.random()*0.05, 0.05+Math.random()*0.05);
      const mat = new THREE.MeshBasicMaterial({ color: 0xe98cb4, side:THREE.DoubleSide });
      const m = new THREE.Mesh(geo, mat);
      m.position.copy(worldPos);
      m.userData.vel = new THREE.Vector3((Math.random()-0.5)*1.4, Math.random()*1.6+0.4, (Math.random()-0.5)*1.4);
      m.userData.spin = (Math.random()-0.5)*8;
      m.userData.life = 0;
      currentGroup.add(m);
      waxChips.push(m);
    }
  }
  function stepChips(dt){
    for (let i=waxChips.length-1;i>=0;i--){
      const m = waxChips[i];
      m.userData.life += dt;
      m.userData.vel.y -= 2.6*dt;
      m.position.addScaledVector(m.userData.vel, dt);
      m.rotation.z += m.userData.spin*dt;
      m.material.opacity = Math.max(0, 1-m.userData.life/0.9);
      m.material.transparent = true;
      if (m.userData.life>0.9 || m.position.y < -0.2){
        currentGroup.remove(m); m.geometry.dispose(); m.material.dispose();
        waxChips.splice(i,1);
      }
    }
  }

  // ==================================================================
  // KEYCAP MODE
  // ==================================================================
  let keys=[]; // {group, cap, target, press, vel, socketMesh}
  function buildKeycap(){
    const group = new THREE.Group();
    addStudioLights(false);
    scene.background = new THREE.Color(0x121212);
    keys = [];

    const baseMat = new THREE.MeshStandardMaterial({color:0x111214, roughness:0.85});
    const plate = new THREE.Mesh(new THREE.BoxGeometry(2.6,0.12,2.6), baseMat);
    plate.position.y = -0.06;
    group.add(plate);

    const gap = 0.78;
    const capMat = new THREE.MeshPhysicalMaterial({color:0x34383f, roughness:0.5, clearcoat:0.3});
    const legendMat = new THREE.MeshBasicMaterial({color:0x8fe3c0});
    const labels = ['Q','W','E','A','S','D','Z','X','C'];
    let li=0;
    for (let row=-1; row<=1; row++){
      for (let col=-1; col<=1; col++){
        const g = new THREE.Group();
        g.position.set(col*gap, 0, row*gap);

        const socket = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.1,0.62),
          new THREE.MeshStandardMaterial({color:0x0a0a0a, roughness:0.9}));
        socket.position.y = 0.0;
        g.add(socket);

        const capGroup = new THREE.Group();
        const cap = new THREE.Mesh(new THREE.BoxGeometry(0.58,0.32,0.58), capMat);
        cap.position.y = 0.16+0.05;
        capGroup.add(cap);

        const legendGeo = new THREE.PlaneGeometry(0.18,0.18);
        const legend = new THREE.Mesh(legendGeo, legendMat);
        legend.rotation.x = -Math.PI/2;
        legend.position.set(0, 0.16+0.05+0.161, 0);
        capGroup.add(legend);

        g.add(capGroup);
        group.add(g);
        keys.push({ group:g, capGroup, restY: capGroup.position.y, press:0, vel:0, target:0, hitMesh:cap });
        li++;
      }
    }

    camera.position.set(0, 2.5, 2.4);
    camera.lookAt(0, 0, 0);
    return group;
  }
  function stepKeys(){
    const spring=0.32, damp=0.62;
    for (const k of keys){
      const accel = (k.target - k.press)*spring;
      k.vel = k.vel*damp + accel;
      k.press = Math.max(0, Math.min(1, k.press+k.vel));
      k.capGroup.position.y = k.restY - k.press*0.11;
    }
  }

  // ==================================================================
  // Mode switching
  // ==================================================================
  const active = new Map();

  function setMode(m){
    current = m;
    disposeGroup(currentGroup);
    if (m==='butter') currentGroup = buildButter();
    else if (m==='wax') currentGroup = buildWax();
    else currentGroup = buildKeycap();
    scene.add(currentGroup);
    matName.textContent = META[m].label;
    matIndex.textContent = META[m].idx;
    switchRow.classList.toggle('show', m==='keycap');
    dish.classList.remove('touched');
    stopAmbient();
    active.clear();
  }

  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      setMode(btn.dataset.m);
    });
  });
  document.querySelectorAll('.sw').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.sw').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      switchType = btn.dataset.sw;
    });
  });

  // ==================================================================
  // Pointer handling
  // ==================================================================
  function onDown(e){
    dish.classList.add('touched');
    ensureAudio(); if (actx.state==='suspended') actx.resume();
    setPtrFromEvent(e);
    raycaster.setFromCamera(ptr, camera);

    if (current==='butter'){
      const hit = raycaster.intersectObject(butterPlane)[0];
      if (hit){
        active.set(e.pointerId, {x:hit.point.x, z:hit.point.z});
        butterDent(hit.point.x, hit.point.z, 0.16, 0.32);
        startAmbient();
        playThud(0.35,'butter');
      }
    } else if (current==='wax'){
      const hit = raycaster.intersectObject(waxMesh)[0];
      if (hit && hit.uv){
        active.set(e.pointerId, {u:hit.uv.x, v:hit.uv.y});
        const r = waxDentAt(hit.uv.x, hit.uv.y, 0.6);
        if (waxHits>2) spawnChips(hit.point, 5+Math.floor(Math.random()*4));
        playCrackle(2+Math.floor(Math.random()*3));
        startAmbient();
      }
    } else if (current==='keycap'){
      const meshes = keys.map(k=>k.hitMesh);
      const hit = raycaster.intersectObjects(meshes)[0];
      if (hit){
        const k = keys.find(kk=>kk.hitMesh===hit.object);
        if (k){ k.target=1; k._down=true; playSwitch(switchType, true); }
        active.set(e.pointerId, {key:k});
      }
    }
    glCanvas.setPointerCapture(e.pointerId);
  }
  function onMove(e){
    const p = active.get(e.pointerId);
    if (!p) return;
    setPtrFromEvent(e);
    raycaster.setFromCamera(ptr, camera);

    if (current==='butter'){
      const hit = raycaster.intersectObject(butterPlane)[0];
      if (hit){
        const dist = Math.hypot(hit.point.x-p.x, hit.point.z-p.z);
        butterDent(hit.point.x, hit.point.z, 0.14, 0.3);
        p.x=hit.point.x; p.z=hit.point.z;
        updateAmbient(Math.min(1,0.3+dist*3), 'butter');
      }
    } else if (current==='wax'){
      const hit = raycaster.intersectObject(waxMesh)[0];
      if (hit && hit.uv){
        const du = hit.uv.x-p.u, dv = hit.uv.y-p.v;
        const dist = Math.hypot(du,dv);
        if (dist > 0.01){
          waxDentAt(hit.uv.x, hit.uv.y, 0.5);
          if (waxHits>2 && Math.random()<0.5) spawnChips(hit.point, 2+Math.floor(Math.random()*3));
          if (Math.random()<0.4) playCrackle(1);
          p.u=hit.uv.x; p.v=hit.uv.y;
          updateAmbient(Math.min(1,0.4+dist*10), 'wax');
        }
      }
    }
  }
  function onUp(e){
    const p = active.get(e.pointerId);
    if (current==='keycap' && p && p.key){ p.key.target=0; playSwitch(switchType,false); }
    active.delete(e.pointerId);
    if (active.size===0) stopAmbient();
  }
  glCanvas.addEventListener('pointerdown', onDown);
  glCanvas.addEventListener('pointermove', onMove);
  glCanvas.addEventListener('pointerup', onUp);
  glCanvas.addEventListener('pointercancel', onUp);
  glCanvas.addEventListener('pointerleave', (e)=>{ if(active.has(e.pointerId)) onUp(e); });

  // ==================================================================
  // Main loop
  // ==================================================================
  let lastT = performance.now();
  function animate(){
    const now = performance.now();
    const dt = Math.min(0.05, (now-lastT)/1000);
    lastT = now;

    if (currentGroup){
      if (active.size===0) currentGroup.rotation.y += 0.0012;
    }
    if (current==='butter' && butterGeom) butterStep();
    if (current==='wax') stepChips(dt);
    if (current==='keycap') stepKeys();

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  initGL();
  loadingEl.style.display='none';
  setMode('butter');
  animate();
})();
</script>
</body>
